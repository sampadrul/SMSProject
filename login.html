<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: #f0f4ff; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 36px 32px; box-shadow: 0 4px 24px rgba(37,99,235,0.1); border: 1px solid #e0e7ff; width: 100%; max-width: 380px; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; color: #1e40af; text-align: center; }
    p { margin: 0 0 24px; font-size: 13px; color: #64748b; text-align: center; }
    label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 5px; color: #374151; letter-spacing: 0.04em; text-transform: uppercase; }
    input[type="password"] { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid #c7d7fe; font-size: 14px; font-family: inherit; background: #f8faff; transition: border-color 0.15s, box-shadow 0.15s; }
    input[type="password"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button { width: 100%; margin-top: 16px; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-family: inherit; box-shadow: 0 2px 8px rgba(37,99,235,0.3); transition: all 0.15s; }
    button:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); box-shadow: 0 4px 16px rgba(37,99,235,0.4); transform: translateY(-1px); }
    .error { margin-top: 12px; font-size: 13px; color: #dc2626; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SMS Campaign Tool</h1>
    <p>Enter your password to continue</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autofocus />
      <button type="submit">Log in</button>
      <div id="error" class="error">Incorrect password. Try again.</div>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        if (res.ok) {
          window.location.href = "/dashboard.html";
        } else {
          errorEl.style.display = "block";
          document.getElementById("password").value = "";
          document.getElementById("password").focus();
        }
      } catch (err) {
        errorEl.textContent = "Connection error. Try again.";
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
