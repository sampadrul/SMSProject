<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contacts | PhotoPing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='6' width='24' height='20' rx='4' fill='%231d4ed8'/><circle cx='14' cy='16' r='6' fill='%2360a5fa'/><circle cx='14' cy='16' r='3' fill='%231e40af'/><circle cx='12' cy='14' r='1' fill='%23bfdbfe' opacity='.8'/><rect x='17' y='4' width='6' height='4' rx='1.5' fill='%231d4ed8'/><circle cx='27' cy='7' r='5' fill='%23f43f5e'/><circle cx='27' cy='7' r='2.5' fill='%23fff' opacity='.35'/></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background: #f0f4ff; color: #0f172a; letter-spacing: -0.01em; }
    header { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%); color: #fff; box-shadow: 0 2px 16px rgba(30,58,138,0.3); }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 24px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-link { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; }
    .brand-link svg { width: 24px; height: 24px; flex-shrink: 0; }
    .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
    .header-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.2); flex-shrink: 0; }
    header .nav-links { display: flex; gap: 4px; align-items: center; }
    header .nav-links a { color: #bfdbfe; text-decoration: none; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
    header .nav-links a:hover { background: rgba(255,255,255,0.2); color: #fff; }
    header .nav-links a.active { background: rgba(255,255,255,0.25); color: #fff; border-color: rgba(255,255,255,0.4); }
    main { max-width: 1200px; margin: 24px auto; padding: 0 20px 48px; display: flex; flex-direction: column; gap: 16px; }
    section { background: #fff; border-radius: 14px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(37,99,235,0.06), 0 4px 16px rgba(37,99,235,0.05); border: 1px solid #e0e7ff; }
    label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 5px; color: #374151; letter-spacing: 0.04em; text-transform: uppercase; }
    input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #c7d7fe; font-size: 14px; font-family: inherit; background: #f8faff; color: #0f172a; transition: border-color 0.15s, box-shadow 0.15s; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button { border-radius: 8px; border: none; padding: 8px 16px; font-size: 13px; cursor: pointer; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-weight: 600; font-family: inherit; box-shadow: 0 1px 3px rgba(37,99,235,0.3); transition: all 0.15s ease; }
    button:hover:not(:disabled) { background: linear-gradient(135deg, #1d4ed8, #1e40af); box-shadow: 0 4px 12px rgba(37,99,235,0.4); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button.secondary { background: #eff6ff; color: #2563eb; border: 1.5px solid #bfdbfe; box-shadow: none; }
    button.secondary:hover:not(:disabled) { background: #dbeafe; border-color: #93c5fd; transform: none; box-shadow: none; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    thead tr { background: #f8faff; }
    th { font-size: 11px; color: #6366f1; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; border-bottom: 2px solid #e0e7ff; text-align: left; }
    td { padding: 10px 8px; border-bottom: 1px solid #f0f4ff; text-align: left; }
    tbody tr:hover td { background: #f8faff; }
    tbody tr:last-child td { border-bottom: none; }
    .small { font-size: 11px; color: #64748b; }
    .status { min-height: 18px; font-size: 13px; margin-top: 8px; }
    .ok { color: #059669; } .err { color: #dc2626; }

    /* Toast notifications */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 420px; padding: 12px 16px; border-radius: 10px; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.12); font-size: 13px; font-family: inherit; color: #0f172a; border-left: 4px solid #3b82f6; animation: toastIn 0.3s ease forwards; cursor: pointer; }
    .toast.success { border-left-color: #22c55e; }
    .toast.error { border-left-color: #ef4444; }
    .toast.info { border-left-color: #3b82f6; }
    .toast.fade-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

    /* Skeleton loading */
    .skeleton { background: linear-gradient(90deg, #e0e7ff 25%, #eef2ff 50%, #e0e7ff 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-row { height: 16px; margin: 10px 0; }
    .skeleton-row.wide { width: 90%; }
    .skeleton-row.medium { width: 60%; }
    .skeleton-row.short { width: 35%; }

    @media (max-width: 600px) {
      .header-inner { flex-wrap: wrap; padding: 12px 16px; gap: 8px; }
      .brand-name { display: none; }
      .header-divider { display: none; }
      header .nav-links { width: 100%; justify-content: center; }
      main { padding: 0 12px 32px; margin-top: 16px; }
      section { padding: 16px 14px; }
      .row { flex-direction: column; gap: 8px; }
      table { font-size: 12px; }
      th, td { padding: 8px 4px; }
      /* Hide: Created column */
      th:nth-child(3), td:nth-child(3) { display: none; }
      .toast { min-width: auto; max-width: calc(100vw - 32px); }
      .toast-container { right: 12px; left: 12px; }
    }

    /* Import dropdown */
    .import-wrap { position: relative; }
    .import-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 200px; background: #fff; border-radius: 10px; border: 1.5px solid #e0e7ff; box-shadow: 0 4px 20px rgba(37,99,235,0.12); padding: 4px; opacity: 0; transform: translateY(-6px) scale(0.96); pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease; z-index: 100; }
    .import-menu.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .import-option { width: 100%; text-align: left; background: none; color: #0f172a; font-weight: 500; border: none; border-radius: 7px; padding: 9px 12px; font-size: 13px; box-shadow: none; }
    .import-option:hover { background: #eff6ff; color: #1d4ed8; transform: none; box-shadow: none; }

    /* Dev Mode FAB */
    .dev-fab { position: fixed; bottom: 20px; right: 20px; z-index: 9998; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: 1.5px solid #c7d7fe; background: #f8faff; color: #94a3b8; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: all 0.2s ease; padding: 0; }
    .dev-fab:hover { border-color: #93c5fd; color: #64748b; }
    .dev-fab.active { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
    <div class="header-left">
      <a href="dashboard.html" class="brand-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="2" y="6" width="24" height="20" rx="4" fill="#fff"/><circle cx="14" cy="16" r="6" fill="#60a5fa"/><circle cx="14" cy="16" r="3" fill="#1e40af"/><circle cx="12" cy="14" r="1" fill="#bfdbfe" opacity=".8"/><rect x="17" y="4" width="6" height="4" rx="1.5" fill="#fff"/><circle cx="27" cy="7" r="5" fill="#f43f5e"/><circle cx="27" cy="7" r="2.5" fill="#fff" opacity=".35"/></svg>
        <span class="brand-name">PhotoPing</span>
      </a>
      <div class="header-divider"></div>
      <div>
        <h1 style="margin:0;font-size:16px;font-weight:700;letter-spacing:-0.02em;">Contacts</h1>
      </div>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Campaigns</a>
      <a href="contacts.html" class="active">Contacts</a>
      <a href="photos.html">Photos</a>
    </div>
    </div>
  </header>

  <main>
    <section>
      <div style="font-weight:700; margin-bottom:6px;">Add Contact</div>
      <div class="small" style="margin-bottom:10px;">
        Create contacts here, then add them into campaigns from the campaign page.
      </div>

      <div class="row">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" placeholder="Jane" />
        </div>
        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" placeholder="Doe" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" placeholder="(555) 555-0123" />
        </div>
      </div>

      <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
        <button id="add">Add</button>
        <div class="import-wrap">
          <button id="importBtn" class="secondary">Import &#9662;</button>
          <div class="import-menu" id="importMenu">
            <button id="importPhone" class="import-option">📱 From Phone Contacts</button>
            <button id="importCsv" class="import-option">📄 From CSV File</button>
          </div>
        </div>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none;" />
      </div>

      <div id="status" class="status"></div>
    </section>

    <section>
      <div style="font-weight:700; margin-bottom:6px;">All Contacts</div>
      <div class="small">These can be attached to any campaign.</div>

      <table>
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Created</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4"><div class="skeleton skeleton-row wide"></div></td></tr>
          <tr><td colspan="4"><div class="skeleton skeleton-row medium"></div></td></tr>
          <tr><td colspan="4"><div class="skeleton skeleton-row short"></div></td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <button id="devFab" class="dev-fab" title="Toggle Dev Mode">&#9881;</button>

  <script>
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      toast.innerHTML = `<span style="font-weight:700;font-size:15px;">${icons[type] || ''}</span><span>${message}</span>`;
      container.appendChild(toast);
      toast.onclick = () => dismissToast(toast);
      if (type !== 'error') {
        setTimeout(() => dismissToast(toast), duration);
      }
    }
    function dismissToast(toast) {
      if (toast.classList.contains('fade-out')) return;
      toast.classList.add('fade-out');
      toast.addEventListener('animationend', () => toast.remove());
    }

    const firstNameEl = document.getElementById("firstName");
    const lastNameEl = document.getElementById("lastName");
    const phoneEl = document.getElementById("phone");
    const addBtn = document.getElementById("add");
    const statusEl = document.getElementById("status");
    const tbody = document.getElementById("tbody");

    // Auto-format phone as (XXX) XXX-XXXX while typing
    phoneEl.addEventListener("input", function() {
      let digits = this.value.replace(/\D/g, "");
      // Strip leading "1" country code if they type it
      if (digits.length > 10 && digits.startsWith("1")) digits = digits.slice(1);
      // Cap at 10 digits
      digits = digits.slice(0, 10);
      // Build formatted string progressively
      let formatted = "";
      if (digits.length > 0) formatted = "(" + digits.slice(0, 3);
      if (digits.length >= 3) formatted += ") ";
      if (digits.length > 3) formatted += digits.slice(3, 6);
      if (digits.length >= 6) formatted += "-";
      if (digits.length > 6) formatted += digits.slice(6);
      this.value = formatted;
    });

    function isLikelyUSPhone(value) {
      const digits = String(value || "").replace(/\D/g, "");
      return digits.length === 10;
    }

    async function fetchJSON(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function fmtPhone(raw) {
      const digits = String(raw || "").replace(/\D/g, "");
      const d = digits.length === 11 && digits.startsWith("1") ? digits.slice(1) : digits;
      if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      return raw;
    }

    function fmt(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return Number.isNaN(d.getTime()) ? ts : d.toLocaleString();
    }

    async function load() {
      const data = await fetchJSON("/api/global-contacts");
      const contacts = data.contacts || [];
      tbody.innerHTML = "";

      if (contacts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:32px 8px;"><div style="font-size:28px;margin-bottom:6px;">👤</div><div style="font-weight:600;margin-bottom:4px;">No contacts yet</div><div class="small">Add your first contact above — you\'ll be able to assign them to campaigns.</div></td></tr>';
        return;
      }

      for (const c of contacts) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c.name}</td>
          <td>${fmtPhone(c.phoneNumber)}</td>
          <td class="small">${fmt(c.createdAt)}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    addBtn.onclick = async () => {
      const first = firstNameEl.value.trim();
      const last = lastNameEl.value.trim();
      const phone = phoneEl.value.trim();

      statusEl.className = "status";
      statusEl.textContent = "";

      if (!first || !last) {
        showToast("Please enter first and last name.", "error");
        return;
      }
      if (!phone) {
        showToast("Please enter a phone number.", "error");
        return;
      }
      if (!isLikelyUSPhone(phone)) {
        showToast("Enter a valid 10-digit US phone number.", "error");
        return;
      }

      const name = first + " " + last;

      try {
        await fetchJSON("/api/global-contacts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phoneNumber: phone })
        });
        showToast(`Contact "${name}" saved!`, "success");
        firstNameEl.value = "";
        lastNameEl.value = "";
        phoneEl.value = "";
        statusEl.textContent = "";
        statusEl.className = "status";
        await load();
      } catch (e) {
        showToast("Error saving contact: " + e.message, "error");
      }
    };

    function handleEnter(e) { if (e.key === 'Enter') addBtn.click(); }
    firstNameEl.addEventListener('keydown', handleEnter);
    lastNameEl.addEventListener('keydown', handleEnter);
    phoneEl.addEventListener('keydown', handleEnter);

    load();

    // --- Import Menu ---
    const importBtn = document.getElementById('importBtn');
    const importMenu = document.getElementById('importMenu');
    const importPhoneBtn = document.getElementById('importPhone');
    const importCsvBtn = document.getElementById('importCsv');
    const csvFileInput = document.getElementById('csvFileInput');

    // Hide phone import option on desktop (Contact Picker API is mobile-only)
    if (!('contacts' in navigator && 'ContactsManager' in window)) {
      importPhoneBtn.style.display = 'none';
    }

    // Toggle dropdown
    importBtn.onclick = (e) => {
      e.stopPropagation();
      importMenu.classList.toggle('visible');
    };

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      if (!importMenu.contains(e.target) && e.target !== importBtn) {
        importMenu.classList.remove('visible');
      }
    });

    // --- Bulk Import (shared by phone + CSV) ---
    async function importContacts(contacts) {
      if (!contacts || contacts.length === 0) {
        showToast('No contacts to import.', 'info');
        return;
      }

      // Pre-fetch existing contacts to detect duplicates locally
      const existing = await fetchJSON('/api/global-contacts');
      const existingPhones = new Set(
        (existing.contacts || []).map(c => c.phoneNumber)
      );

      let created = 0, existed = 0, failed = 0, skipped = 0;

      for (const c of contacts) {
        if (!c.phone) { skipped++; continue; }

        // Normalize phone to digits for comparison
        const digits = c.phone.replace(/\D/g, '');
        const normalized = digits.length === 10 ? '+1' + digits
          : (digits.length === 11 && digits.startsWith('1')) ? '+' + digits
          : null;

        if (!normalized) { failed++; continue; }

        if (existingPhones.has(normalized)) {
          existed++;
          continue;
        }

        try {
          await fetchJSON('/api/global-contacts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: c.name, phoneNumber: c.phone })
          });
          existingPhones.add(normalized);
          created++;
        } catch (e) {
          failed++;
        }
      }

      // Build summary message
      const parts = [];
      if (created > 0) parts.push(`Imported ${created} new contact${created !== 1 ? 's' : ''}`);
      if (existed > 0) parts.push(`${existed} already existed`);
      if (skipped > 0) parts.push(`${skipped} skipped (no phone)`);
      if (failed > 0) parts.push(`${failed} failed`);

      const msg = created > 0
        ? parts[0] + (parts.length > 1 ? ` (${parts.slice(1).join(', ')})` : '')
        : parts.join(', ') || 'No contacts imported';

      showToast(msg, created > 0 ? 'success' : 'info');
      await load();
    }

    // --- Phone Contacts Import ---
    importPhoneBtn.onclick = async () => {
      importMenu.classList.remove('visible');
      try {
        const results = await navigator.contacts.select(['name', 'tel'], { multiple: true });
        const contacts = results
          .filter(r => r.tel && r.tel.length > 0)
          .map(r => ({
            name: (r.name && r.name[0]) || 'Unknown',
            phone: r.tel[0]
          }));
        await importContacts(contacts);
      } catch (e) {
        if (e.name === 'AbortError') return; // user cancelled
        showToast('Error accessing contacts: ' + e.message, 'error');
      }
    };

    // --- CSV Import ---
    importCsvBtn.onclick = () => {
      importMenu.classList.remove('visible');
      csvFileInput.value = '';
      csvFileInput.click();
    };

    function parseCSV(text) {
      if (!text || !text.trim()) throw new Error('CSV file is empty.');

      // Split a single CSV line respecting quoted fields
      function splitRow(line) {
        const fields = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuotes) {
            if (ch === '"' && line[i + 1] === '"') {
              current += '"';  // escaped quote
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              current += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ',') {
              fields.push(current.trim());
              current = '';
            } else {
              current += ch;
            }
          }
        }
        fields.push(current.trim());
        return fields;
      }

      const lines = text.replace(/\r\n/g, '\n').split('\n').filter(l => l.trim());
      if (lines.length === 0) throw new Error('CSV file has no data.');

      const firstFields = splitRow(lines[0]);

      // Detect whether the first row is a header
      const phoneSynonyms = ['phone', 'phone_number', 'phonenumber', 'tel', 'telephone', 'mobile', 'cell'];
      const nameSynonyms = ['name', 'full_name', 'fullname', 'contact'];
      const firstSynonyms = ['first_name', 'firstname', 'first'];
      const lastSynonyms = ['last_name', 'lastname', 'last'];

      const lowerFields = firstFields.map(f => f.toLowerCase().replace(/\s+/g, '_'));
      const hasPhoneHeader = lowerFields.some(f => phoneSynonyms.includes(f));
      const hasNameHeader = lowerFields.some(f => nameSynonyms.includes(f));
      const hasFirstHeader = lowerFields.some(f => firstSynonyms.includes(f));
      const isHeader = hasPhoneHeader && (hasNameHeader || hasFirstHeader);

      let phoneIdx = -1, nameIdx = -1, firstIdx = -1, lastIdx = -1;
      let dataStart = 0;

      if (isHeader) {
        // Map column indices from header names
        dataStart = 1;
        lowerFields.forEach((f, i) => {
          if (phoneSynonyms.includes(f)) phoneIdx = i;
          if (nameSynonyms.includes(f)) nameIdx = i;
          if (firstSynonyms.includes(f)) firstIdx = i;
          if (lastSynonyms.includes(f)) lastIdx = i;
        });
      } else {
        // Headerless: guess by column count
        const cols = firstFields.length;
        if (cols === 2) {
          nameIdx = 0; phoneIdx = 1;
        } else if (cols >= 3) {
          firstIdx = 0; lastIdx = 1; phoneIdx = 2;
        } else {
          throw new Error('Cannot parse CSV: expected at least 2 columns (name, phone).');
        }
      }

      const contacts = [];
      for (let i = dataStart; i < lines.length; i++) {
        const fields = splitRow(lines[i]);
        const phone = fields[phoneIdx] || '';
        let name = '';
        if (nameIdx >= 0) {
          name = fields[nameIdx] || '';
        } else if (firstIdx >= 0) {
          const first = fields[firstIdx] || '';
          const last = (lastIdx >= 0 ? fields[lastIdx] : '') || '';
          name = (first + ' ' + last).trim();
        }
        if (!name && !phone) continue;  // skip blank rows
        contacts.push({ name: name || 'Unknown', phone });
      }

      if (contacts.length === 0) throw new Error('No contacts found in CSV file.');
      return contacts;
    }

    csvFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const contacts = parseCSV(text);
        await importContacts(contacts);
      } catch (err) {
        showToast(err.message || 'Failed to parse CSV file.', 'error');
      }
    });

    // --- Dev Mode FAB ---
    function applyDevMode() {
      const isOn = localStorage.getItem('devMode') === 'true';
      document.getElementById('devFab').classList.toggle('active', isOn);
    }

    document.getElementById('devFab').onclick = function() {
      const isOn = localStorage.getItem('devMode') === 'true';
      localStorage.setItem('devMode', isOn ? 'false' : 'true');
      applyDevMode();
    };

    applyDevMode();
  </script>
</body>
</html>
