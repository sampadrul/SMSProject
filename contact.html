<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background: #f0f4ff; color: #0f172a; letter-spacing: -0.01em; }
    header { background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(37,99,235,0.25); }
    header .left { display: flex; align-items: center; gap: 14px; }
    header a { color: #bfdbfe; text-decoration: none; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
    header a:hover { background: rgba(255,255,255,0.2); color: #fff; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    header .small { color: #bfdbfe; }
    main { max-width: 1100px; margin: 24px auto 48px; padding: 0 20px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
    section { background: #fff; border-radius: 14px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(37,99,235,0.06), 0 4px 16px rgba(37,99,235,0.05); border: 1px solid #e0e7ff; }
    h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; }
    p.subtle { margin: 0 0 12px; font-size: 13px; color: #64748b; line-height: 1.5; }
    .small { font-size: 11px; color: #64748b; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    thead tr { background: #f8faff; }
    th { font-size: 11px; color: #6366f1; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px; border-bottom: 2px solid #e0e7ff; text-align: left; vertical-align: middle; }
    td { padding: 10px 8px; border-bottom: 1px solid #f0f4ff; text-align: left; vertical-align: middle; }
    tbody tr:hover td { background: #f8faff; }
    tbody tr:last-child td { border-bottom: none; }
    .badge { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #dbeafe; color: #1d4ed8; border: none; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
    .photo-card { background: #f8faff; border: 1.5px solid #e0e7ff; border-radius: 10px; overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; }
    .photo-card:hover { box-shadow: 0 4px 16px rgba(37,99,235,0.15); transform: translateY(-2px); }
    .photo-card img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .photo-meta { padding: 5px 7px 7px; font-size: 11px; }
    .photo-meta-top { display: flex; justify-content: space-between; gap: 4px; }
    .reuse { margin-top: 4px; padding: 2px 6px; border-radius: 6px; border: 1px solid #f59e0b; background: #fffbeb; color: #92400e; display: inline-block; }
    .link { color: #2563eb; text-decoration: none; font-size: 11px; font-weight: 500; }
    .link:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    /* Toast notifications */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 420px; padding: 12px 16px; border-radius: 10px; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.12); font-size: 13px; font-family: inherit; color: #0f172a; border-left: 4px solid #3b82f6; animation: toastIn 0.3s ease forwards; cursor: pointer; }
    .toast.success { border-left-color: #22c55e; }
    .toast.error { border-left-color: #ef4444; }
    .toast.info { border-left-color: #3b82f6; }
    .toast.fade-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

    /* Skeleton loading */
    .skeleton { background: linear-gradient(90deg, #e0e7ff 25%, #eef2ff 50%, #e0e7ff 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-row { height: 16px; margin: 10px 0; }
    .skeleton-row.wide { width: 90%; }
    .skeleton-row.medium { width: 60%; }
    .skeleton-row.short { width: 35%; }
    .skeleton-card { height: 120px; border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <a href="contacts.html">&larr; Contacts</a>
      <div>
        <div class="small">Contact</div>
        <h1 id="contactName">Loading…</h1>
        <div class="small" id="contactPhone"></div>
      </div>
    </div>
    <div class="right" style="display:flex;gap:8px;">
      <a href="dashboard.html">Campaigns</a>
      <a href="photos.html">Photos</a>
    </div>
  </header>

  <main>
    <section>
      <h2>Campaign memberships</h2>
      <p class="subtle">
        Campaigns this contact is part of, including send dates and how many photos they’ve sent in each.
      </p>
      <table>
        <thead>
          <tr>
            <th>Campaign</th>
            <th>Added</th>
            <th>First sent</th>
            <th>Last send</th>
            <th>Photos</th>
          </tr>
        </thead>
        <tbody id="campaignsTbody">
          <tr><td colspan="5"><div class="skeleton skeleton-row wide"></div></td></tr>
          <tr><td colspan="5"><div class="skeleton skeleton-row medium"></div></td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <h2>Photos from this contact</h2>
      <p class="subtle">
        All photos this contact has sent, across all campaigns.
      </p>
      <div id="photosContainer">
        <div class="photo-grid">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      toast.innerHTML = `<span style="font-weight:700;font-size:15px;">${icons[type] || ''}</span><span>${message}</span>`;
      container.appendChild(toast);
      toast.onclick = () => dismissToast(toast);
      if (type !== 'error') {
        setTimeout(() => dismissToast(toast), duration);
      }
    }
    function dismissToast(toast) {
      if (toast.classList.contains('fade-out')) return;
      toast.classList.add('fade-out');
      toast.addEventListener('animationend', () => toast.remove());
    }

    const params = new URLSearchParams(window.location.search);
    const contactId = params.get("id");

    const els = {
      contactName: document.getElementById("contactName"),
      contactPhone: document.getElementById("contactPhone"),
      campaignsTbody: document.getElementById("campaignsTbody"),
      photosContainer: document.getElementById("photosContainer")
    };

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function fmt(ts) {
      if (!ts) return "–";
      const d = new Date(ts);
      return Number.isNaN(d.getTime()) ? ts : d.toLocaleString();
    }

    async function loadDetails() {
      if (!contactId) {
        els.contactName.textContent = "No contact id";
        els.campaignsTbody.innerHTML = `<tr><td colspan="5" class="small">Missing contact id in URL (?id=...)</td></tr>`;
        els.photosContainer.textContent = "";
        return;
      }

      try {
        const data = await fetchJSON(`/api/contact-details/${encodeURIComponent(contactId)}`);
        const { contact, campaigns, photos } = data;

        els.contactName.textContent = contact.name || "(unnamed)";
        els.contactPhone.textContent = contact.phoneNumber;

        // Campaign memberships
        els.campaignsTbody.innerHTML = "";
        if (!campaigns.length) {
          els.campaignsTbody.innerHTML = `<tr><td colspan="5" class="small">Not in any campaigns yet.</td></tr>`;
        } else {
          const sortedCamps = campaigns.slice().sort(
            (a, b) => new Date(b.addedAt) - new Date(a.addedAt)
          );
          for (const c of sortedCamps) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>
                <a class="link" href="campaign.html?id=${encodeURIComponent(c.campaignId)}">
                  ${c.campaignName}
                </a>
              </td>
              <td class="small">${fmt(c.addedAt)}</td>
              <td class="small">${fmt(c.firstSentAt)}</td>
              <td class="small">${fmt(c.lastOutboundAt)}</td>
              <td class="small">${c.photoCount}</td>
            `;
            els.campaignsTbody.appendChild(tr);
          }
        }

        // Photos
        if (!photos.length) {
          els.photosContainer.textContent = "No photos from this contact yet.";
        } else {
          els.photosContainer.innerHTML = "";
          const grid = document.createElement("div");
          grid.className = "photo-grid";

          for (const p of photos) {
            const card = document.createElement("div");
            card.className = "photo-card";

            const img = document.createElement("img");
            img.src = p.url;
            img.alt = p.filename;
            card.appendChild(img);

            const meta = document.createElement("div");
            meta.className = "photo-meta";

            const top = document.createElement("div");
            top.className = "photo-meta-top";
            top.innerHTML = `
              <div>${p.filename}</div>
              <div class="small">${fmt(p.createdAt)}</div>
            `;
            meta.appendChild(top);

            const line2 = document.createElement("div");
            line2.className = "small";
            if (p.campaignId && p.campaignName) {
              line2.innerHTML = `
                From campaign:
                <a class="link" href="campaign.html?id=${encodeURIComponent(p.campaignId)}">
                  ${p.campaignName}
                </a>
              `;
            } else if (p.campaignId) {
              line2.innerHTML = `
                From campaign:
                <a class="link" href="campaign.html?id=${encodeURIComponent(p.campaignId)}">
                  (no name)
                </a>
              `;
            } else {
              line2.textContent = "Not assigned to a campaign";
            }
            meta.appendChild(line2);

            if (p.similarInOtherCampaigns && p.similarInOtherCampaigns.length > 0) {
              const reuse = document.createElement("div");
              reuse.className = "reuse";
              reuse.textContent = `⚠ Also used in ${p.similarInOtherCampaigns.length} other campaign(s)`;
              meta.appendChild(reuse);
            }

            card.appendChild(meta);
            grid.appendChild(card);
          }

          els.photosContainer.appendChild(grid);
        }

      } catch (e) {
        els.campaignsTbody.innerHTML = `<tr><td colspan="5" class="small">Failed to load data.</td></tr>`;
        els.photosContainer.innerHTML = `<div class="small">Failed to load photos.</div>`;
        showToast("Error loading contact details: " + e.message, "error");
      }
    }

    loadDetails();
  </script>
</body>
</html>
