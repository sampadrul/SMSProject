<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; background: #f0f4ff; color: #0f172a; letter-spacing: -0.01em; }
    header { background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(37,99,235,0.25); }
    header .nav-links { display: flex; gap: 4px; align-items: center; }
    header .nav-links a { color: #bfdbfe; text-decoration: none; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
    header .nav-links a:hover { background: rgba(255,255,255,0.2); color: #fff; }
    header .nav-links a.active { background: rgba(255,255,255,0.25); color: #fff; border-color: rgba(255,255,255,0.4); }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    header .small { color: #bfdbfe; }
    main { max-width: 1100px; margin: 24px auto 48px; padding: 0 20px; }
    h2 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; }
    p.subtle { margin: 0 0 16px; font-size: 13px; color: #64748b; line-height: 1.5; }
    .badge { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #dbeafe; color: #1d4ed8; border: none; }
    .sender-block { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(37,99,235,0.06), 0 4px 16px rgba(37,99,235,0.05); border: 1px solid #e0e7ff; margin-bottom: 14px; }
    .sender-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sender-header h3 { margin: 0; font-size: 14px; font-weight: 600; color: #0f172a; }
    .small { font-size: 11px; color: #64748b; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
    .photo-card { background: #f8faff; border: 1.5px solid #e0e7ff; border-radius: 10px; overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; }
    .photo-card:hover { box-shadow: 0 4px 16px rgba(37,99,235,0.15); transform: translateY(-2px); }
    .photo-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .photo-meta { padding: 5px 7px 7px; font-size: 11px; }
    .photo-meta-top { display: flex; justify-content: space-between; gap: 4px; }
    .link { color: #2563eb; text-decoration: none; font-size: 11px; font-weight: 500; }
    .link:hover { text-decoration: underline; }
    .reuse { margin-top: 4px; padding: 2px 6px; border-radius: 6px; border: 1px solid #f59e0b; background: #fffbeb; color: #92400e; display: inline-block; font-size: 11px; }
    @media (max-width: 600px) {
      header { flex-wrap: wrap; padding: 12px 16px; gap: 8px; }
      header .left { gap: 10px; }
      header h1 { font-size: 15px; }
      header .small { font-size: 10px; }
      header .nav-links { width: 100%; justify-content: center; }
      main { padding: 0 12px; margin-top: 16px; margin-bottom: 32px; }
      .sender-block { padding: 12px; }
      .sender-header { flex-direction: column; align-items: flex-start; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .toast { min-width: auto; max-width: calc(100vw - 32px); }
      .toast-container { right: 12px; left: 12px; }
    }

    /* Toast notifications */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 420px; padding: 12px 16px; border-radius: 10px; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.12); font-size: 13px; font-family: inherit; color: #0f172a; border-left: 4px solid #3b82f6; animation: toastIn 0.3s ease forwards; cursor: pointer; }
    .toast.success { border-left-color: #22c55e; }
    .toast.error { border-left-color: #ef4444; }
    .toast.info { border-left-color: #3b82f6; }
    .toast.fade-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

    /* Skeleton loading */
    .skeleton { background: linear-gradient(90deg, #e0e7ff 25%, #eef2ff 50%, #e0e7ff 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-card { height: 140px; border-radius: 10px; }

    /* Lightbox overlay */
    .lightbox-overlay { display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
    .lightbox-overlay.active { display: flex; animation: lightboxIn 0.2s ease; }
    @keyframes lightboxIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.15s; padding: 0; box-shadow: none; }
    .lightbox-close:hover { background: rgba(255,255,255,0.15); }
    .lightbox-filename { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 8px; text-align: center; }

    /* Dev Mode FAB */
    .dev-fab { position: fixed; bottom: 20px; right: 20px; z-index: 9998; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: 1.5px solid #c7d7fe; background: #f8faff; color: #94a3b8; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: all 0.2s ease; padding: 0; }
    .dev-fab:hover { border-color: #93c5fd; color: #64748b; }
    .dev-fab.active { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="small">Gallery</div>
      <h1>All Photos</h1>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Campaigns</a>
      <a href="contacts.html">Contacts</a>
      <a href="photos.html" class="active">Photos</a>
    </div>
  </header>

  <main>
    <h2>Photos across all campaigns</h2>
    <p class="subtle">
      This view shows every photo you’ve received, grouped by contact. Each photo indicates which
      campaign it came from, and whether it’s reused in other campaigns.
    </p>

    <div id="photosRoot">
      <div class="photo-grid" style="margin-top:0;">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <button id="devFab" class="dev-fab" title="Toggle Dev Mode">&#9881;</button>

  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-filename" id="lightboxFilename"></div>
    </div>
  </div>

  <script>
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      toast.innerHTML = `<span style="font-weight:700;font-size:15px;">${icons[type] || ''}</span><span>${message}</span>`;
      container.appendChild(toast);
      toast.onclick = () => dismissToast(toast);
      if (type !== 'error') {
        setTimeout(() => dismissToast(toast), duration);
      }
    }
    function dismissToast(toast) {
      if (toast.classList.contains('fade-out')) return;
      toast.classList.add('fade-out');
      toast.addEventListener('animationend', () => toast.remove());
    }

    // Lightbox functions
    function openLightbox(src, alt) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxImg').alt = alt;
      document.getElementById('lightboxFilename').textContent = alt;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightboxImg').src = '';
    }
    document.getElementById('lightboxClose').onclick = closeLightbox;
    document.getElementById('lightbox').onclick = function(e) {
      if (e.target === this) closeLightbox();
    };
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    const root = document.getElementById("photosRoot");

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function fmtPhone(raw) {
      const digits = String(raw || "").replace(/\D/g, "");
      const d = digits.length === 11 && digits.startsWith("1") ? digits.slice(1) : digits;
      if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      return raw;
    }

    function fmt(ts) {
      if (!ts) return "–";
      const d = new Date(ts);
      return Number.isNaN(d.getTime()) ? ts : d.toLocaleString();
    }

    async function loadPhotos() {
      try {
        const data = await fetchJSON("/api/photos");
        const items = data.data || [];

        if (!items.length) {
          root.innerHTML = '<div style="text-align:center;padding:48px 20px;"><div style="font-size:36px;margin-bottom:8px;">📸</div><div style="font-weight:600;font-size:15px;margin-bottom:6px;">No photos yet</div><div class="small">Once you send a campaign, photos from your contacts will appear here.</div><a href="dashboard.html" style="display:inline-block;margin-top:12px;font-size:13px;">Go to Campaigns →</a></div>';
          return;
        }

        root.innerHTML = "";

        for (const sender of items) {
          const block = document.createElement("div");
          block.className = "sender-block";

          const header = document.createElement("div");
          header.className = "sender-header";
          header.innerHTML = `
            <div>
              <h3>${sender.name || fmtPhone(sender.phoneNumber)}</h3>
              <div class="small">${fmtPhone(sender.phoneNumber)}</div>
            </div>
            <div class="small">
              <span class="badge">${sender.photos.length} photo(s)</span><br>
              <a class="link" href="contact.html?id=${encodeURIComponent(sender.contactId || "")}">
                View contact details
              </a>
            </div>
          `;
          block.appendChild(header);

          const grid = document.createElement("div");
          grid.className = "photo-grid";

          // Most recent first
          const photosSorted = sender.photos.slice().sort(
            (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
          );

          for (const p of photosSorted) {
            const card = document.createElement("div");
            card.className = "photo-card";

            const img = document.createElement("img");
            img.src = p.url;
            img.alt = p.filename;
            img.style.cursor = 'pointer';
            img.onclick = () => openLightbox(img.src, img.alt);
            card.appendChild(img);

            const meta = document.createElement("div");
            meta.className = "photo-meta";

            const top = document.createElement("div");
            top.className = "photo-meta-top";
            top.innerHTML = `
              <div>${p.filename}</div>
              <div class="small">${fmt(p.createdAt)}</div>
            `;
            meta.appendChild(top);

            const line2 = document.createElement("div");
            line2.className = "small";
            if (p.campaignId && p.campaignName) {
              line2.innerHTML = `
                From campaign:
                <a class="link" href="campaign.html?id=${encodeURIComponent(p.campaignId)}">
                  ${p.campaignName}
                </a>
              `;
            } else if (p.campaignId) {
              line2.innerHTML = `
                From campaign:
                <a class="link" href="campaign.html?id=${encodeURIComponent(p.campaignId)}">
                  (no name)
                </a>
              `;
            } else {
              line2.textContent = "Not assigned to a campaign";
            }
            meta.appendChild(line2);

            if (p.similarInOtherCampaigns && p.similarInOtherCampaigns.length > 0) {
              const reuse = document.createElement("div");
              reuse.className = "reuse";
              reuse.textContent = `⚠ Also used in ${p.similarInOtherCampaigns.length} other campaign(s)`;
              meta.appendChild(reuse);
            }

            card.appendChild(meta);
            grid.appendChild(card);
          }

          block.appendChild(grid);
          root.appendChild(block);
        }
      } catch (e) {
        root.innerHTML = `<div class="small">Failed to load photos.</div>`;
        showToast("Error loading photos: " + e.message, "error");
      }
    }

    loadPhotos();

    // --- Dev Mode FAB ---
    function applyDevMode() {
      const isOn = localStorage.getItem('devMode') === 'true';
      document.getElementById('devFab').classList.toggle('active', isOn);
    }

    document.getElementById('devFab').onclick = function() {
      const isOn = localStorage.getItem('devMode') === 'true';
      localStorage.setItem('devMode', isOn ? 'false' : 'true');
      applyDevMode();
    };

    applyDevMode();
  </script>
</body>
</html>
